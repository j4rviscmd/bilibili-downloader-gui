name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ['main']
    paths:
      - 'docs/**'
  workflow_dispatch:

# Why top-level read-only: Scorecard Token-Permissions max pattern
# (issue #677); the Pages scopes live on the jobs below (build needs
# pages: read for metadata, deploy needs the write scopes)
permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Why job-level: actions/configure-pages@v4 reads the Pages site
    # metadata via the API, which requires pages: read on GITHUB_TOKEN
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Why: Astro v7 requires Node.js >= 22.12
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build Astro site
        working-directory: ./docs
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Why job-level (official actions/deploy-pages pattern): pages +
    # id-token are required only for the deployment itself
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
