name: Windows ZIP validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/package-windows.ps1'
      - 'src-tauri/ffmpeg-binaries.json'
      - 'src-tauri/src/handlers/ffmpeg.rs'
      - '.github/workflows/windows-zips.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Build ZIP editions and validate bundled FFmpeg
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-zip-editions
          path: artifacts/windows/*.zip
