# CI workflow for PRs to main branch
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-format
        with:
          path: node_modules
          key: nm-format-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-format.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-lint
        with:
          path: node_modules
          key: nm-lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-lint.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-build
        with:
          path: node_modules
          key: nm-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-build.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check and build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-test
        with:
          path: node_modules
          key: nm-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-test.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests with coverage
        # Why coverage run: the vitest.config.ts line threshold ratchets
        # coverage per PR; a plain run would not enforce it
        if: hashFiles('**/*.test.ts', '**/*.test.tsx', '**/*.spec.ts', '**/*.spec.tsx') != ''
        run: |
          if grep -q '"test"' package.json; then
            npm run test:coverage
          else
            echo "No test script defined in package.json, skipping tests."
          fi

      - name: Upload frontend coverage to Codecov
        # Why the guard: upload only when the test step actually produced
        # lcov, mirroring the step above
        if: hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          # Why false: threshold enforcement lives in vitest; codecov
          # outages must not fail this required job
          fail_ci_if_error: false

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Check Rust code
        working-directory: src-tauri
        run: cargo check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Run Clippy
        working-directory: src-tauri
        # Why: --all-targets also lints test targets; plain clippy covers lib/bins only, and
        # the test-coverage plan (see dev-dependencies note in src-tauri/Cargo.toml) adds
        # unit tests that must stay warning-free
        run: cargo clippy --all-targets -- -D warnings

  # Why: cargo test also compiles and runs doctests — this job enforces them and is what
  # surfaced the 19 failing doc examples fixed in this PR
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

  # Why report-only (not in ci-status needs): coverage visibility disciplines
  # the test-coverage push without failing PRs on flaky nightly/toolchain
  # drift; rust-test remains the required green gate.
  coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        # Why nightly: cargo-llvm-cov relies on -Zinstrument-coverage,
        # which is not stable yet
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Why: nightly build artifacts must not share a cache with the
          # stable rust-ci jobs above in this file — nightly/stable rustc
          # fingerprints differ, so a distinct shared-key keeps the caches
          # from competing for the same slot
          shared-key: rust-ci-nightly

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Generate Codecov report
        working-directory: src-tauri
        # Why --codecov: codecov-native JSON (region coverage included);
        # --ignore-filename-regex also applies to the exported file
        # Why the jq rewrite: llvm-cov emits absolute file paths, but codecov
        # needs repo-relative ones to match flags.rust.paths and the ignore
        # list in codecov.yml — normalize "/…/src-tauri/src/x.rs" to
        # "src-tauri/src/x.rs" (frontend lcov is already repo-relative)
        run: |
          cargo llvm-cov --codecov --output-path codecov.json \
            --ignore-filename-regex 'src/(main|lib|menu)\.rs'
          jq '.coverage |= with_entries(.key |= sub("^.*src-tauri/"; "src-tauri/"))' \
            codecov.json > codecov-normalized.json

      - name: Upload rust coverage to Codecov
        # Why before the threshold step: the report is uploaded even when
        # coverage is below target, so codecov shows the regression
        uses: codecov/codecov-action@v7
        with:
          files: src-tauri/codecov-normalized.json
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          # Why false: report-only policy — codecov outages must not turn
          # this job red; only the local threshold step may fail it
          fail_ci_if_error: false

      - name: Enforce threshold and write summary
        working-directory: src-tauri
        # Why pipefail: without it the step exit code comes from tee (always 0),
        # silently masking a threshold breach as a green, half-empty report
        # Why `report` (not a fresh run): reuses the profdata written by the
        # generate step above — tests run once per job
        # Why 69: ratchet measured at 70.66% lines locally after the PR③
        # download-pipeline batch (issue #626) — the 70% milestone; CI tracks
        # local within ~0.3pt at this size, floor minus one per the
        # vitest.config.ts convention; bump as coverage grows, never lower.
        # CAUTION: baseline must be measured on CI, not locally — macOS/nightly
        # measured 56.62% over 20174 lines while CI counts 12056 lines
        # (nightly rustc coverage mapping differs per platform)
        run: |
          set -o pipefail
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          # Why `|| rc=$?`: on a threshold breach the pipeline must still
          # write the closing code fence below; without the || guard, bash -e
          # would abort here and leave the summary with an unclosed fence
          # that renders the page as code
          rc=0
          cargo llvm-cov report --summary-only --show-missing-lines \
            --ignore-filename-regex 'src/(main|lib|menu)\.rs' \
            --fail-under-lines 69 \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  docs-format:
    name: Docs Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache docs/node_modules
        uses: actions/cache@v4
        id: cache-nm-docs
        with:
          path: docs/node_modules
          key: nm-docs-${{ runner.os }}-${{ hashFiles('docs/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-docs.outputs.cache-hit != 'true'
        working-directory: docs
        run: npm ci

      - name: Check formatting
        working-directory: docs
        run: npm run format:check

  ci-status:
    name: CI status check
    runs-on: ubuntu-latest
    needs:
      [
        format,
        lint,
        frontend-build,
        test,
        rust-check,
        rust-clippy,
        rust-test,
        rust-format,
        docs-format,
      ]
    if: always()
    steps:
      - name: Some checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All checks passed
        run: exit 0
