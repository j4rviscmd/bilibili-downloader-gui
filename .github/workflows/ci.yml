# CI workflow for PRs to main branch
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-format
        with:
          path: node_modules
          key: nm-format-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-format.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-lint
        with:
          path: node_modules
          key: nm-lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-lint.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-build
        with:
          path: node_modules
          key: nm-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-build.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check and build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-test
        with:
          path: node_modules
          key: nm-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-test.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests with coverage
        # Why coverage run: the vitest.config.ts line threshold ratchets
        # coverage per PR; a plain run would not enforce it
        if: hashFiles('**/*.test.ts', '**/*.test.tsx', '**/*.spec.ts', '**/*.spec.tsx') != ''
        run: |
          if grep -q '"test"' package.json; then
            npm run test:coverage
          else
            echo "No test script defined in package.json, skipping tests."
          fi

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Check Rust code
        working-directory: src-tauri
        run: cargo check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Run Clippy
        working-directory: src-tauri
        # Why: --all-targets also lints test targets; plain clippy covers lib/bins only, and
        # the test-coverage plan (see dev-dependencies note in src-tauri/Cargo.toml) adds
        # unit tests that must stay warning-free
        run: cargo clippy --all-targets -- -D warnings

  # Why: cargo test also compiles and runs doctests — this job enforces them and is what
  # surfaced the 19 failing doc examples fixed in this PR
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

  # Why report-only (not in ci-status needs): coverage visibility disciplines
  # the test-coverage push without failing PRs on flaky nightly/toolchain
  # drift; rust-test remains the required green gate.
  coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        # Why nightly: cargo-llvm-cov relies on -Zinstrument-coverage,
        # which is not stable yet
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Why: nightly build artifacts must not share a cache with the
          # stable rust-ci jobs above in this file — nightly/stable rustc
          # fingerprints differ, so a distinct shared-key keeps the caches
          # from competing for the same slot
          shared-key: rust-ci-nightly

      - name: Install dependencies (Ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Run coverage
        working-directory: src-tauri
        # Why pipefail: without it the step exit code comes from tee (always 0),
        # silently masking cargo-llvm-cov failures as a green, half-empty report
        run: |
          set -o pipefail
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov --summary-only --show-missing-lines \
            --ignore-filename-regex 'src/(main|lib|menu)\.rs' \
            | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  docs-format:
    name: Docs Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache docs/node_modules
        uses: actions/cache@v4
        id: cache-nm-docs
        with:
          path: docs/node_modules
          key: nm-docs-${{ runner.os }}-${{ hashFiles('docs/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-docs.outputs.cache-hit != 'true'
        working-directory: docs
        run: npm ci

      - name: Check formatting
        working-directory: docs
        run: npm run format:check

  ci-status:
    name: CI status check
    runs-on: ubuntu-latest
    needs:
      [
        format,
        lint,
        frontend-build,
        test,
        rust-check,
        rust-clippy,
        rust-test,
        rust-format,
        docs-format,
      ]
    if: always()
    steps:
      - name: Some checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All checks passed
        run: exit 0
