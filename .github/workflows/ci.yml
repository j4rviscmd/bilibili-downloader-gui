# CI workflow for PRs to main branch
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Why checks/issues write: reviewdog github-pr-review needs them for
# review comments and its Check-annotation fallback for findings outside
# the PR diff (per reviewdog/action-suggester upstream requirements)
permissions:
  contents: write
  checks: write
  issues: write
  pull-requests: write

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-format
        with:
          path: node_modules
          key: nm-format-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-format.outputs.cache-hit != 'true'
        run: npm ci

      # Why the PR/push split: reviewdog reporters only work on
      # pull_request events; push to main keeps the plain check
      - name: Apply Prettier
        if: github.event_name == 'pull_request'
        run: npx prettier --write .

      - name: Suggest formatting changes
        # Why cleanup:false: keeps the formatted state so the gate step
        # below sees the full diff (filter-mode only limits which hunks
        # get suggestion cards, not which violations fail the job)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: prettier
          level: error
          filter_mode: added
          cleanup: false

      - name: Fail on unformatted files
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Check formatting
        if: github.event_name != 'pull_request'
        run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-lint
        with:
          path: node_modules
          key: nm-lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-lint.outputs.cache-hit != 'true'
        run: npm ci

      # Why the PR/push split: reviewdog reporters only work on
      # pull_request events; push to main keeps the plain lint
      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1

      # Why pipefail: eslint's exit code must survive the pipe so the
      # gate semantics match `npm run lint` (fail on any error anywhere,
      # not just errors on added lines that reviewdog reports)
      # Why --format=json + jq: ESLint 9 dropped the built-in checkstyle
      # formatter, so JSON is converted to RDFormat here instead (same
      # shape as the clippy job). env.PWD strips the absolute filePath
      # prefix reviewdog cannot match against the repo-relative diff
      - name: Run ESLint
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx eslint . --format=json \
            | jq -c '.[] | .filePath as $f | .messages[] | {
                code: (if .ruleId then { value: .ruleId } else null end),
                message: .message,
                severity: (if .severity == 2 then "ERROR" else "WARNING" end),
                location: {
                  path: ($f | sub("^" + env.PWD + "/"; "")),
                  range: {
                    start: { line: .line, column: .column },
                    end: { line: (.endLine // .line), column: (.endColumn // .column) }
                  }
                }
              }' \
            | reviewdog -f=rdjsonl -name=eslint \
                -reporter=github-pr-review -filter-mode=added \
                -fail-level=error -tee

      - name: Run ESLint
        if: github.event_name != 'pull_request'
        run: npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-build
        with:
          path: node_modules
          key: nm-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-build.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check and build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nm-test
        with:
          path: node_modules
          key: nm-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-test.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests with coverage
        # Why coverage run: the vitest.config.ts line threshold ratchets
        # coverage per PR; a plain run would not enforce it
        if: hashFiles('**/*.test.ts', '**/*.test.tsx', '**/*.spec.ts', '**/*.spec.tsx') != ''
        run: |
          if grep -q '"test"' package.json; then
            npm run test:coverage
          else
            echo "No test script defined in package.json, skipping tests."
          fi

      - name: Upload frontend coverage to Codecov
        # Why the guard: upload only when the test step actually produced
        # lcov, mirroring the step above
        if: hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          # Why false: threshold enforcement lives in vitest; codecov
          # outages must not fail this required job
          fail_ci_if_error: false

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Check Rust code
        working-directory: src-tauri
        run: cargo check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      # Why the PR/push split: reviewdog reporters only work on
      # pull_request events; push to main keeps the plain clippy
      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1

      # Why pipefail: cargo's exit code must survive the pipes so the
      # gate matches plain `cargo clippy -- -D warnings` (any denied lint
      # fails the job even when outside the PR's added lines)
      # Why 2>/dev/null: cargo writes progress to stderr; diagnostics
      # arrive as JSON on stdout. -tee echoes parsed findings back to
      # the log so hard compile errors stay debuggable
      - name: Run Clippy
        if: github.event_name == 'pull_request'
        working-directory: src-tauri
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format=json -- -D warnings 2>/dev/null \
            | jq -c 'select(.reason == "compiler-message")
                | .message.spans as $sp
                | (($sp | map(select(.is_primary)) | first) // $sp[0]) as $s
                | select($s != null and .message.code != null)
                # Why RDFormat field names (code/message/severity/range):
                # reviewdog -f=rdjsonl silently discards unknown fields, so
                # Code Climate-style keys (check_name/description/lines) or
                # lowercase severity would post nothing (verified against
                # reviewdog v0.21.0)
                | {
                    code: { value: .message.code.code },
                    message: .message.message,
                    severity: (if .message.level == "error" then "ERROR" else "WARNING" end),
                    location: {
                      path: ("src-tauri/" + $s.file_name),
                      range: {
                        start: { line: $s.line_start, column: $s.column_start },
                        end: { line: $s.line_end, column: $s.column_end }
                      }
                    }
                  }' \
            | reviewdog -f=rdjsonl -name=clippy \
                -reporter=github-pr-review -filter-mode=added \
                -fail-level=error -tee

      - name: Run Clippy
        if: github.event_name != 'pull_request'
        working-directory: src-tauri
        # Why: --all-targets also lints test targets; plain clippy covers lib/bins only, and
        # the test-coverage plan (see dev-dependencies note in src-tauri/Cargo.toml) adds
        # unit tests that must stay warning-free
        run: cargo clippy --all-targets -- -D warnings

  # Why: cargo test also compiles and runs doctests — this job enforces them and is what
  # surfaced the 19 failing doc examples fixed in this PR
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      # Why the PR/push split: action-suggester only supports
      # pull_request events; push to main keeps the plain check
      - name: Apply rustfmt
        if: github.event_name == 'pull_request'
        working-directory: src-tauri
        run: cargo fmt

      - name: Suggest formatting changes
        # Why cleanup:false: keeps the formatted state so the gate step
        # below sees the full diff (filter-mode only limits which hunks
        # get suggestion cards, not which violations fail the job)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: rustfmt
          level: error
          filter_mode: added
          cleanup: false

      - name: Fail on unformatted files
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Check Rust formatting
        if: github.event_name != 'pull_request'
        working-directory: src-tauri
        run: cargo fmt --check

  # Why in ci-status needs (required): a coverage regression must fail the
  # PR, not just report — early detection beats post-hoc triage (user
  # decision 2026-09-11, issue #646 maintenance phase). The codecov upload
  # step inside stays fail_ci_if_error: false so codecov outages don't gate
  # PRs; only the local llvm-cov threshold may fail this job.
  coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        # Why nightly: cargo-llvm-cov relies on -Zinstrument-coverage,
        # which is not stable yet
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Why: nightly build artifacts must not share a cache with the
          # stable rust-ci jobs above in this file — nightly/stable rustc
          # fingerprints differ, so a distinct shared-key keeps the caches
          # from competing for the same slot
          shared-key: rust-ci-nightly

      - name: Install dependencies (Ubuntu only)
        # Why the || warning: the runner image ships third-party apt sources
        # (dl.google.com chrome, packages.microsoft.com) whose indexes
        # intermittently fail hash verification while the publisher is
        # mid-sync, failing every Rust job here with exit 100 even though
        # the Ubuntu archives are healthy (4 consecutive PR runs,
        # 2026-09-09; retry and sourceparts= both failed — sourceparts= also
        # drops noble's deb822 ubuntu.sources, so no packages resolve).
        # Tolerating a partial update is safe: the install below hard-fails
        # if the UBUNTU indexes are unusable, which is the only failure we
        # care about; a broken chrome/microsoft index is irrelevant here.
        run: |
          sudo apt-get update || echo "::warning::apt-get update partially failed; relying on whichever indexes resolved"
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libglib2.0-dev

      - name: Generate Codecov report
        working-directory: src-tauri
        # Why --codecov: codecov-native JSON (region coverage included);
        # --ignore-filename-regex also applies to the exported file
        # Why the jq rewrite: llvm-cov emits absolute file paths, but codecov
        # needs repo-relative ones to match flags.rust.paths and the ignore
        # list in codecov.yml — normalize "/…/src-tauri/src/x.rs" to
        # "src-tauri/src/x.rs" (frontend lcov is already repo-relative)
        run: |
          cargo llvm-cov --codecov --output-path codecov.json \
            --ignore-filename-regex 'src/(main|lib|menu)\.rs'
          jq '.coverage |= with_entries(.key |= sub("^.*src-tauri/"; "src-tauri/"))' \
            codecov.json > codecov-normalized.json

      - name: Upload rust coverage to Codecov
        # Why before the threshold step: the report is uploaded even when
        # coverage is below target, so codecov shows the regression
        uses: codecov/codecov-action@v7
        with:
          files: src-tauri/codecov-normalized.json
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          # Why false: report-only policy — codecov outages must not turn
          # this job red; only the local threshold step may fail it
          fail_ci_if_error: false

      - name: Enforce threshold and write summary
        working-directory: src-tauri
        # Why pipefail: without it the step exit code comes from tee (always 0),
        # silently masking a threshold breach as a green, half-empty report
        # Why `report` (not a fresh run): reuses the profdata written by the
        # generate step above — tests run once per job
        # Why 81: ratchet measured at 82.44% lines on CI after the PR⑩
        # coverage(off) batch (issue #646 closed at that line) — floor
        # keeps ~1.4pt headroom per the vitest.config.ts convention; bump
        # as coverage grows, never lower.
        # CAUTION: baseline must be measured on CI, not locally — macOS/nightly
        # measured 56.62% over 20174 lines while CI counts 12056 lines
        # (nightly rustc coverage mapping differs per platform)
        run: |
          set -o pipefail
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          # Why `|| rc=$?`: on a threshold breach the pipeline must still
          # write the closing code fence below; without the || guard, bash -e
          # would abort here and leave the summary with an unclosed fence
          # that renders the page as code
          rc=0
          cargo llvm-cov report --summary-only --show-missing-lines \
            --ignore-filename-regex 'src/(main|lib|menu)\.rs' \
            --fail-under-lines 81 \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  docs-format:
    name: Docs Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache docs/node_modules
        uses: actions/cache@v4
        id: cache-nm-docs
        with:
          path: docs/node_modules
          key: nm-docs-${{ runner.os }}-${{ hashFiles('docs/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm-docs.outputs.cache-hit != 'true'
        working-directory: docs
        run: npm ci

      # Why the PR/push split: action-suggester only supports
      # pull_request events; push to main keeps the plain check
      - name: Apply Prettier
        if: github.event_name == 'pull_request'
        working-directory: docs
        run: npx prettier --write .

      - name: Suggest formatting changes
        # Why cleanup:false: keeps the formatted state so the gate step
        # below sees the full diff (filter-mode only limits which hunks
        # get suggestion cards, not which violations fail the job)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: prettier-docs
          level: error
          filter_mode: added
          cleanup: false

      - name: Fail on unformatted files
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Check formatting
        if: github.event_name != 'pull_request'
        working-directory: docs
        run: npm run format:check

  ci-status:
    name: CI status check
    runs-on: ubuntu-latest
    needs:
      [
        format,
        lint,
        frontend-build,
        test,
        rust-check,
        rust-clippy,
        rust-test,
        rust-format,
        coverage,
        docs-format,
      ]
    if: always()
    steps:
      - name: Some checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All checks passed
        run: exit 0
