# CodeQL static analysis for code-level vulnerability patterns (issue #628)
# Why advanced setup (not default setup): Rust is not selectable in default
# setup yet, and this repo's argon2/aes-gcm cookie encryption lives in Rust
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Why paths-ignore: a merged release-please PR only bumps version
    # fields (.release-please-manifest.json + the extra-files bump in
    # src-tauri/tauri.conf.json, see release-please-config.json with
    # skip-changelog: true), so the push run re-analyzed code identical
    # to the previous push (~9 min for nothing). Feature pushes always
    # touch files outside this list and still trigger. Only the push
    # event is filtered — pull_request/schedule/dispatch ignore paths.
    paths-ignore:
      - .release-please-manifest.json
      - src-tauri/tauri.conf.json
  # Why schedule: catch newly-published CodeQL queries between pushes
  schedule:
    - cron: '34 5 * * 1' # weekly, Monday 14:34 JST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Why top-level read-only: Scorecard Token-Permissions max pattern
# (issue #677); the analyze job escalates to what codeql-action needs
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Why skip: a release-please PR contains no code changes (same
    # rationale as the push paths-ignore above). Empty head_ref on
    # push/schedule/dispatch keeps those triggers running.
    if: github.head_ref != 'release-please--branches--main'
    permissions:
      # Why these permissions: minimum set required by codeql-action to
      # upload results to code scanning (docs: advanced setup security hardening)
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Why build-mode none for every language: JS/TS and Actions extract
          # without building; Rust GA analysis requires build-mode none
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
