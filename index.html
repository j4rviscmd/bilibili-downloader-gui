<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Why no-referrer: Akamai hdnts token auth on upos-*.akamaized.net
         mirrors 403s any foreign Referer (measured 2026-10-09: none/bilibili
         = 206, app-origin localhost = 403), which killed <video> preview
         playback on those mirrors with MEDIA_ERR_SRC_NOT_SUPPORTED. Applies
         document-wide; the remaining subresources (hdslb thumbnails, Google
         Fonts) are Referer-insensitive. -->
    <meta name="referrer" content="no-referrer" />
    <title>Bilibili Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Caution: crossorigin is required on THIS preconnect only. Font files
         from fonts.gstatic.com are fetched via an anonymous CORS request, so
         without crossorigin the preopened connection is not reused and the
         browser opens a second one, defeating the preconnect. The
         googleapis.com preconnect above intentionally omits it because the
         stylesheet response is not a CORS request. (web.dev/preconnect) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        var t = localStorage.getItem('ui-theme') || 'system'
        var d =
          t === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : t === 'dark'
        var c = d ? 'dark' : 'light'
        document.documentElement.classList.add(c)
        document.documentElement.style.colorScheme = c
        document.documentElement.style.backgroundColor = d
          ? '#252525'
          : '#ffffff'
      })()
    </script>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
