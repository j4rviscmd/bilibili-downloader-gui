[package]
name = "bilibili-downloader-gui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bilibili_downloader_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required to enable transparent windows on macOS — the
# WebviewWindowBuilder::transparent() method is cfg-gated behind this feature
# on macOS (no-op on Windows/Linux). Used by the splash window to render
# rounded corners. App Store distribution is not a target (GitHub Releases
# only), so private API use is acceptable here.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.98"
reqwest = { version = "0.12.24", features = ["json", "stream", "blocking", "gzip", "brotli"] }
# Direct dependency for pre-parsing subtitle URLs so a malformed URL fails
# with a precise error instead of an opaque reqwest "builder error". Already
# present transitively via reqwest; pinning here makes the usage explicit.
url = "2"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
octocrab = "0.42"
semver = "0.11"
xz2 = { version = "0.1.7", features = ["static"] }
tar = "0.4.44"
zip = "2.2.3"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-process = "2"
futures = "0.3.31"
once_cell = "1.18.0"
# Why: inter-process file locking (flock / LockFileEx) for the multi-process
# safe JSON stores and download reservation files (issue #560).
fs2 = "0.4"
libc = "0.2"
rand = "0.8"
chrono = "0.4"
md5 = "0.7"
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
rsa = "0.9"
sha2 = "0.10"
base16ct = { version = "0.2", features = ["alloc"] }
num-bigint = "0.4.6"
argon2 = "0.5"
aes-gcm = "0.10"
hostname = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
# Note: Consumed only by get_app_info (lib.rs) to expose OS name/version/arch
# to the About dialog. Keep only as long as that command needs tauri-plugin-os.
tauri-plugin-os = "2"
log = "0.4"

[target.'cfg(all(not(any(target_os = "android", target_os = "ios")), debug_assertions))'.dependencies]
tauri-plugin-webdriver = "0.2"
tauri-plugin-mcp-bridge = "0.11"

[dev-dependencies]
# Why: declared up front (PR R1 of the test-coverage plan) so later PRs add
# tests without re-touching Cargo.toml. No test code uses them yet — they are
# consumed by upcoming PRs:
# - tempfile: fs-touching tests (secure_storage, cookie Firefox fixtures, ...)
# - wiremock: local mock HTTP server for BiliApi transport tests (no live network)
# - tokio test-util: #[tokio::test(start_paused = true)] for deterministic time
#   in emits.rs tests
# - tauri "test" feature: tauri::test::mock_app() for AppHandle-coupled tests.
#   Applies to test builds only; release binaries are unaffected.
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
tauri = { version = "2", features = ["test"] }
