[package]
name = "bilibili-downloader-gui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bilibili_downloader_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required to enable transparent windows on macOS — the
# WebviewWindowBuilder::transparent() method is cfg-gated behind this feature
# on macOS (no-op on Windows/Linux). Used by the splash window to render
# rounded corners. App Store distribution is not a target (GitHub Releases
# only), so private API use is acceptable here.
# unstable: gates Window::add_child (multiple webviews in one window), used
# by the preview overlay (handlers/preview_embed.rs) to embed the player
# page in the main window instead of a separate OS window.
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.98"
reqwest = { version = "0.12.24", features = ["json", "stream", "blocking", "gzip", "brotli"] }
# Direct dependency for pre-parsing subtitle URLs so a malformed URL fails
# with a precise error instead of an opaque reqwest "builder error". Already
# present transitively via reqwest; pinning here makes the usage explicit.
url = "2"
# Why: convertFileSrc percent-encodes (encodeURIComponent) the paths the
# stream:// protocol handler receives, so the handler must percent-decode
# them. Already present transitively via tauri; pinned here explicitly.
percent-encoding = "2"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
octocrab = "0.42"
semver = "0.11"
xz2 = { version = "0.1.7", features = ["static"] }
flate2 = "1"
tar = "0.4.44"
zip = "2.2.3"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-process = "2"
futures = "0.3.31"
once_cell = "1.18.0"
# Why: inter-process file locking (flock / LockFileEx) for the multi-process
# safe JSON stores and download reservation files (issue #560).
fs2 = "0.4"
rand = "0.9"
# Why: rsa 0.9 still requires rand_core 0.6 for its Rng arguments; rand 0.9
# uses rand_core 0.9. rsa encryption therefore takes rand_core::OsRng (0.6)
# directly instead of a rand 0.9 rng.
rand_core = "0.6"
chrono = "0.4"
md5 = "0.7"
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
rsa = "0.9"
sha2 = "0.10"
base16ct = { version = "0.2", features = ["alloc"] }
num-bigint = "0.4.6"
argon2 = "0.5"
aes-gcm = "0.10"
hostname = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
# Note: Consumed only by get_app_info (lib.rs) to expose OS name/version/arch
# to the About dialog. Keep only as long as that command needs tauri-plugin-os.
tauri-plugin-os = "2"
log = "0.4"

# Note: cargo ignores `debug_assertions` in target.'cfg()' dependency
# selectors (with a manifest warning), so these are plain desktop deps.
# Their dev-only registration is gated by #[cfg(debug_assertions)] in lib.rs.
tauri-plugin-webdriver = "0.2"
tauri-plugin-mcp-bridge = "0.13"

[target.'cfg(windows)'.dependencies]
# Embed-player preview: WebView2 CookieManager COM injection of session
# cookies as domain cookies (tauri re-exports the same webview2-com types
# tauri-runtime-wry uses; windows-core supplies the Interface casts).
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
# Preview overlay positioning: NSWindow.contentLayoutRect gives the
# title-bar inset that tao's inner_position() does not report (the main
# window's webview starts below the title bar). 0.2.x is the copy wry's
# objc2-web-kit already builds (tao uses 0.3.x as a separate node), so
# no extra code is compiled in. NSResponder is required too: it gates
# the NSWindow class and frame()/contentLayoutRect() themselves.
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSResponder"] }
# Preview overlay session cookies: WKHTTPCookieStore is the only macOS API
# that stores a DOMAIN cookie with its leading dot intact — tauri's
# `Webview::set_cookie` round-trips through the `cookie` crate's
# `domain()` getter, which strips the dot, and the cookie then lands
# host-only for `bilibili.com` (measured 2026-10-12: the preview page's
# requests carried no session → logged-out player). wry already builds
# objc2-web-kit 0.3.1 and objc2-foundation 0.3.1 (and tauri builds objc2 /
# block2), so these add no new compiled code.
objc2 = "0.6"
objc2-foundation = { version = "0.3.1", features = ["NSDictionary", "NSHTTPCookie", "NSString"] }
objc2-web-kit = { version = "0.3.1", features = [
  "WKHTTPCookieStore",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "block2",
] }
block2 = "0.6"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
# Same defect as the macOS arm above: the portable `set_cookie` path
# writes a host-only cookie, so the preview's Linux/BSD build injects
# session cookies through WebKitGTK's own cookie manager instead.
# Versions are pinned to the copies tauri-runtime-wry already builds —
# a different webkit2gtk minor would be a separate crate instance and
# `PlatformWebview::inner()` would not type-check against it.
webkit2gtk = "=2.0.2"
soup3 = "0.5"
gio = "0.18"

[dev-dependencies]
# Why: declared up front (PR R1 of the test-coverage plan) so later PRs add
# tests without re-touching Cargo.toml. No test code uses them yet — they are
# consumed by upcoming PRs:
# - tempfile: fs-touching tests (secure_storage, cookie Firefox fixtures, ...)
# - wiremock: local mock HTTP server for BiliApi transport tests (no live network)
# - tokio test-util: #[tokio::test(start_paused = true)] for deterministic time
#   in emits.rs tests
# - tauri "test" feature: tauri::test::mock_app() for AppHandle-coupled tests.
#   Applies to test builds only; release binaries are unaffected.
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
tauri = { version = "2", features = ["test"] }

# Why: `coverage` cfg is set only by the ci.yml coverage job's
# --cfg-coverage flag (see the cfg_attr in lib.rs); registering it here
# silences rustc's unexpected_cfgs lint for stable -D warnings builds.
[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage)'] }
