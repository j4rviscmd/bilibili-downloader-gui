items:
  - question: 免费使用吗？
    answer: "是的，Bilibili Downloader GUI完全免费且开源。您可以在GitHub上找到源代码。"
  - question: 如何下载视频？
    answer: "只需将Bilibili视频URL粘贴到应用程序中并点击下载。视频将保存到设置中指定的保存文件夹（默认为Downloads文件夹）。\n\n注意：本应用仅供教育和个人使用。请遵守服务条款和版权法，未经权利人许可请勿下载或再分发内容。开发者对使用本应用所产生的任何问题不承担责任。"
  - question: 如何登录？
    answer: "应用支持两种登录方式：Firefox Cookie 自动检测和二维码登录。使用 Firefox 时，只需在 Firefox 中登录 Bilibili，无需在应用中手动登录。使用二维码登录时，用 Bilibili 手机应用扫描应用中显示的二维码。两种方式可随时切换。下载 1080p 或更高画质需要先登录。"
  - question: 支持哪些视频质量？
    answer: "支持360p、480p、720p、1080p、1080p60fps、4K等多种画质。可用画质取决于登录状态和Bilibili大会员。未登录：最高480p。已登录：最高1080p。大会员：1080p+高码率、1080p60帧、4K超清等高画质。"
  - question: 可以下载字幕吗？
    answer: "是的，可以将字幕嵌入视频中。支持两种模式：软字幕（播放器可切换）和硬字幕（永久烧录）。也支持 AI 生成字幕，并实时显示下载进度。\n\n注意：需要Firefox登录。"
  - question: 在哪里可以查看版本和环境信息？
    answer: "从应用菜单打开“关于”对话框（macOS 上使用应用菜单，其他平台从应用内菜单打开）。可以查看应用版本以及 Tauri 和系统环境信息。"
  - question: 下载失败怎么办？
    answer: "首先确认视频没有被Bilibili地区限制、链接是否正确。然后尝试用Firefox Cookie或二维码重新登录。网络错误应用会自动重试,若持续失败,请稍后再试。"
  - question: 必须登录吗？
    answer: "不登录也能下载,最高480p。1080p及以上需要登录;字幕下载需要通过Firefox登录。"
  - question: 手机(iPhone/Android)能用吗？
    answer: "不能,本应用是Windows和macOS的桌面软件。手机上可使用Bilibili官方App的下载功能(有限制),或将电脑保存的视频传输到手机。"
  - question: 安全吗?有病毒吗？
    answer: "安全。本应用是开源软件,源代码全部在GitHub公开,任何人都能审查,也不附带广告。"
  - question: 可以只保存MP3音频吗？
    answer: "可以,支持从视频中单独提取音频。详细步骤请看MP3保存指南:https://j4rviscmd.github.io/bilibili-downloader-gui/zh/guides/download-mp3-audio/"
