items:
  - question: 無料で使用できますか？
    answer: "はい、Bilibili Downloader GUIは完全に無料でオープンソースです。ソースコードはGitHubで公開されています。"
  - question: 動画をダウンロードするには？
    answer: "Bilibiliの動画URLをアプリケーションに貼り付けて、ダウンロードをクリックするだけです。動画は設定画面で指定した保存先フォルダに保存されます（デフォルトはDownloadsフォルダです）。\n\n注意：このアプリは教育目的および個人利用を想定しています。利用規約と著作権法を遵守し、権利者の許可なくコンテンツをダウンロード・再配布しないでください。本アプリの使用により生じたいかなる問題についても、開発者は一切の責任を負いません。"
  - question: ログインはどうやって行いますか？
    answer: "アプリは2つのログイン方法に対応しています：FirefoxのCookie自動検出とQRコードログイン。Firefoxの場合、事前にFirefoxでBilibiliにログインしておけば手動操作は不要です。QRコードログインの場合、アプリ内に表示されるQRコードをBilibiliモバイルアプリでスキャンします。2つの方法はいつでも切り替えられます。1080p以上の高画質でダウンロードするには、事前にログインしてください。"
  - question: どの画質がサポートされていますか？
    answer: "360p、480p、720p、1080p、1080p60fps、4Kなどに対応しています。利用可能な画質はログイン状態とBilibili大会員の有無によって異なります。ログインなしでは480pまで、ログインすると1080pまで、大会員なら1080p高ビットレート、1080p60fps、4Kなどの高画質が利用可能です。"
  - question: 字幕をダウンロードできますか？
    answer: "はい、動画に字幕を埋め込むことができます。ソフト字幕（プレイヤーで切替可能）とハード字幕（動画に焼付）の2モードに対応。AI生成字幕にも対応し、ダウンロードの進捗がリアルタイムで表示されます。\n\n注意：Firefoxでのログインが必要です。"
  - question: バージョンや環境情報はどこで確認できますか？
    answer: "アプリのメニューからAboutダイアログを開いてください（macOSではアプリメニュー、その他のプラットフォームではアプリ内メニューから）。アプリのバージョンやTauri・システムの環境情報を確認できます。"
  - question: ダウンロードできない・失敗する場合はどうすればいいですか？
    answer: "まずBilibili側で動画が地域制限されていないか、URLが正しいかを確認してください。次に、Firefox CookieまたはQRコードでログインし直すと解決する場合があります。ネットワークエラーの場合はアプリが自動でリトライしますが、失敗が続く場合はしばらく時間を置いてからお試しください。"
  - question: ログインは必須ですか？
    answer: "いいえ、ログインなしでも480pまでの画質でダウンロードできます。1080p以上の高画質ではログインが必要で、字幕のダウンロードにはFirefoxでのログインが必要です。"
  - question: スマホ(iPhone/Android)では使えますか？
    answer: "いいえ、本アプリはWindowsとmacOS向けのデスクトップアプリです。スマホではBilibili公式アプリのダウンロード機能(制限あり)を利用するか、PCで保存した動画を転送してください。"
  - question: 安全に使えますか？ウイルスはありませんか？
    answer: "はい。本アプリはオープンソースで、ソースコードはGitHubで全て公開されており、誰でも内容を確認できます。広告も同梱されていません。"
  - question: 音声だけをMP3で保存できますか？
    answer: "はい、動画から音声のみを抽出して保存できます。詳しい手順はMP3保存ガイド(https://j4rviscmd.github.io/bilibili-downloader-gui/ja/guides/download-mp3-audio/)をご覧ください。"
